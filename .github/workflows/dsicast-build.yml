name: DSiCast Experimental Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get nds-bootstrap v2.16.0
        run: |
          git clone https://github.com/DS-Homebrew/nds-bootstrap.git source
          cd source
          git checkout 8630be2bb5a861ea1eef2819a9ac9014927367b3
          git submodule update --init --recursive

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y gcc p7zip-full
          gcc source/lzss.c -o /usr/local/bin/lzss

      - name: Build baseline
        run: |
          cd source
          make package-nightly

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DSiCast-build-test
          path: source/bin/
